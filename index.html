<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/newlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Regaal &ndash; Best Corporate Hotel in Jalgaon</title>
    <meta
      name="description"
      content="The Regaal — feel the regal touch. Luxury rooms, suites and resort facilities, a unit of Chaudhari Hotels &amp; Hospitality."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- KeyIO Booking Engine Integration Script — pasted as supplied by KeyIO.
         Defines window.KeyIOBooking.book(); src/lib/booking.js calls it.
         When KeyIO sends an updated snippet, replace this block only. -->
    <script>
      /**
       * KeyIO Booking Engine Integration Script
       * Property: 13
       * Booking Engine: https://internal-be.keyio.ai
       */
      ;(function () {
        var BOOKING_URL = 'https://internal-be.keyio.ai'
        var OPEN_NEW_TAB = false

        window.KeyIOBooking = {
          url: BOOKING_URL,
          book: function (params) {
            if (!params || !params.checkIn || !params.checkOut) {
              console.error('[KeyIOBooking] checkIn and checkOut are required.')
              return
            }
            var qs =
              'checkIn=' +
              encodeURIComponent(params.checkIn) +
              '&checkOut=' +
              encodeURIComponent(params.checkOut) +
              '&adults=' +
              (parseInt(params.adults, 10) || 1) +
              '&children=' +
              (parseInt(params.children, 10) || 0) +
              '&infants=' +
              (parseInt(params.infants, 10) || 0)
            var target = BOOKING_URL + '?' + qs
            if (OPEN_NEW_TAB) {
              window.open(target, '_blank')
            } else {
              window.location.href = target
            }
          },
        }
      })()
    </script>
  </body>
</html>
